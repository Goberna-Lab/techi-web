name: Deploy

# Deploy de techi-web a vps2, INLINE (repo público: no puede usar el reusable privado de
# platform; mismo patrón que gavilano). El runner (vps2-techi-runner, label "techi") corre EN
# vps2, así que el rsync al docroot es LOCAL (sin red). CI (ci.yml) ya valida lint+build en el
# PR; acá solo se hace el build del merge commit + rsync. Sin cache:npm: en self-hosted el
# ~/.npm del runner ya persiste local; el cache de Actions sería un round-trip lento a GitHub.
#
# Repo público + runner self-hosted: este workflow corre SOLO en push a main y dispatch.
# Nunca agregar `pull_request` acá (un PR desde un fork ejecutaría código en vps2).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-techi
  cancel-in-progress: false

env:
  DOCROOT: /srv/nexus-containers/techi/public

jobs:
  deploy:
    runs-on: [self-hosted, techi]   # runner vps2-techi-runner (corre EN vps2)
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund   # install desde el ~/.npm local (sin red)
          npm run build                                   # base '/' (dominio raíz)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Guard dist + rsync local al docroot
        run: |
          set -euo pipefail

          # El rsync va con --delete: lo que no esté en dist/ se BORRA del servidor. No alcanza
          # con "dist/ no está vacía" (public/ se copia aunque el bundle falle): se exigen el
          # HTML y los assets de verdad.
          [ -f dist/index.html ] || { echo "::error::falta dist/index.html -> abort"; exit 1; }
          [ -n "$(find dist/assets -name '*.js' -type f -print -quit 2>/dev/null)" ] || { echo "::error::faltan los JS de dist/assets -> abort"; exit 1; }

          # El docroot lo crea infra. Si no existe, rsync lo crearía como directorio suelto que
          # nginx no sirve y el deploy quedaría en verde con el sitio caído.
          [ -d "$DOCROOT" ] || { echo "::error::no existe $DOCROOT -> abort"; exit 1; }

          # Dos pasadas a propósito: la primera sube lo nuevo SIN borrar (los assets con hash
          # quedan disponibles antes de que el index.html nuevo los pida; un 404 de
          # /assets/*.js se cachearía en el edge de Cloudflare), la segunda limpia lo viejo.
          # -t preserva mtimes: sin él rsync retransmite el sitio entero en cada deploy.
          sudo rsync -rlt --chmod=D755,F644 dist/ "$DOCROOT/"
          sudo rsync -rlt --delete --chmod=D755,F644 dist/ "$DOCROOT/"
          echo "deploy OK -> $DOCROOT"
